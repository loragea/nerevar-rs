[workspace]
members = ["crates/nerevar-core", "crates/nerevar-cli", "crates/nerevar-host"]

[package]
name = "nerevar"
version = "0.1.10"
description = "Morrowind Multiplayer without the mod-list headaches."
authors = ["Kyle Austad"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nerevar_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nerevar-core = { path = "crates/nerevar-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version ="0.13.3", features = ["json", "stream"] }
tokio = { version = "1.52.3", features = ["full"] }
ts-rs = "12.0.1"
rfd = "0.17.2"
tauri-plugin-log = { version = "2", features = ["colored"] }
log = "0.4"
notify = { version = "8.2.0", features = ["serde"] }
opener = "0.8.4"
