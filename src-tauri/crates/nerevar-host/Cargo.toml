[package]
name = "nerevar-host"
version = "0.1.0"
edition = "2021"
description = "Headless daemon: hosts one owned Nerevar instance (sync server + TES3MP dedicated server) without the Tauri GUI."

[[bin]]
name = "nerevar-host"
path = "src/main.rs"

[dependencies]
nerevar-core = { path = "../nerevar-core" }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
tokio = { version = "1.52.3", features = ["full"] }
log = "0.4"
serde_json = "1"
