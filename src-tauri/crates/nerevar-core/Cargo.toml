[package]
name = "nerevar-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "nerevar_core"

[features]
test-util = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
log = "0.4"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
zip = "8.6.0"
flate2 = "1.1.9"
tar = "0.4.46"
crc32fast = "1.4.2"
encoding_rs = "0.8.35"
rayon = "1.10"
dirs = "6"
axum = "0.8.9"
netstat2 = "0.11.2"
sysinfo = "0.37.2"
sha2 = "0.10.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
urlencoding = "2.1.3"
csv = "1.3"
uuid = { version = "1.23.1", features = ["v4"] }
