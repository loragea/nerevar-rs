[package]
name = "nerevar-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "nerevar_core"

[features]
test-util = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
log = "0.4"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
tokio = { version = "1.52.3", features = ["full"] }
zip = "8.6.0"
flate2 = "1.1.9"
tar = "0.4.46"
crc32fast = "1.4.2"
encoding_rs = "0.8.35"
rayon = "1.10"
dirs = "6"
