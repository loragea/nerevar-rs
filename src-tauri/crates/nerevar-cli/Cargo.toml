[package]
name = "nerevar-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line Nerevar client: headless player-side sync, and the co-admin surface for a headless host."

[[bin]]
name = "nerevar-cli"
path = "src/main.rs"

[lib]
name = "nerevar_cli"
path = "src/lib.rs"

[dependencies]
nerevar-core = { path = "../nerevar-core" }
clap = { version = "4", features = ["derive"] }
# `stream` is what makes `PUT /admin/packages/{name}` a streamed upload: it
# gates `impl From<tokio::fs::File> for reqwest::Body`, so a multi-GiB archive
# is read chunk by chunk instead of into memory.
reqwest = { version = "0.13.3", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
log = "0.4"

[dev-dependencies]
# The integration test boots the same axum server the daemon serves and drives
# it through this crate's library functions; it builds its upload fixture with
# the same zip writer core's own tests use.
zip = "8.6.0"
uuid = { version = "1.23.1", features = ["v4"] }
