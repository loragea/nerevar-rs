name: CI

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo check / test / clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # DIAGNOSTIC: does this runner's kill(1) honour `kill -KILL -<pgid>`,
      # the form nerevar-core shells out to? Run in a throwaway session so a
      # kill(1) that signals its own process group instead takes only that
      # session with it. The sleeper sits in its own group and must die.
      - name: What kill -KILL -<pgid> does here
        run: |
          /usr/bin/kill --version || true
          dpkg -s procps | grep '^Version' || true
          setsid -w bash -c '
            setsid sleep 300 & t=$!; sleep 0.3
            /usr/bin/kill -KILL -$t; echo "kill rc=$?"; sleep 0.5
            if kill -0 $t 2>/dev/null; then
              echo "sleeper $t ALIVE: the group kill did not reach it"
              /usr/bin/kill -KILL -- -$t; sleep 0.3
              kill -0 $t 2>/dev/null && echo "still alive after the -- form" || echo "dead after the -- form"
            else
              echo "sleeper dead: the group kill worked"
            fi'
          echo "probe session exit=$?  (137 means kill(1) killed its own process group)"

      # Everything the Tauri crate links against. The daemon and the CLI need
      # none of it, but the workspace builds as a unit.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # ts-rs writes the TypeScript bindings during `cargo test`, and the
      # frontend typecheck below reads them, so the Rust job runs first and
      # the frontend job re-runs the tests rather than sharing state.
      # --workspace is mandatory: src-tauri is both the workspace root and the
      # `nerevar` package, so a bare command skips nerevar-core and the two
      # headless crates entirely.
      - run: cargo check --workspace
        working-directory: src-tauri

      # Building and running the tests are separate steps so that a runner
      # lost mid-way (GitHub's "lost communication with the server", which
      # leaves no log for the step in flight) still says which phase died,
      # and the step between records what the build left for the tests.
      - name: Build the tests
        run: cargo test --workspace --no-run
        working-directory: src-tauri

      - name: Disk and memory after the build
        run: |
          df -h /
          du -sh src-tauri/target
          free -m

      # DIAGNOSTIC (remove once the lost runner is explained): the runner has
      # died during nerevar-core's unit tests on every run so far. One thread
      # makes the order exact, so the last line printed before the runner
      # goes names the test that preceded the killer.
      - name: Core unit tests, one process each, two minutes apiece
        working-directory: src-tauri
        run: |
          set -uo pipefail
          bin=$(cargo test -p nerevar-core --lib --no-run --message-format=json 2>/dev/null |
            jq -r 'select(.profile.test==true and .target.name=="nerevar-core") | .executable' | tail -1)
          echo "test binary: $bin"
          "$bin" --list 2>/dev/null | sed -n 's/: test$//p' | while read -r t; do
            start=$(date +%s)
            if timeout -k 5 120 "$bin" --exact "$t" --test-threads=1 >/tmp/one-test.log 2>&1; then
              echo "ok   $(( $(date +%s) - start ))s $t"
            else
              rc=$?
              echo "FAIL rc=$rc $(( $(date +%s) - start ))s $t"
              tail -20 /tmp/one-test.log
              free -m | grep Mem
              df -h / | tail -1
              ps -eo pid,ppid,rss,etimes,args --sort=-rss | head -8
            fi
          done
          echo "all core tests attempted"

      - name: Run the tests
        run: cargo test --workspace
        working-directory: src-tauri

      - run: cargo clippy --workspace --all-targets
        working-directory: src-tauri

  windows-cross-check:
    name: cargo check (windows target)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies and mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            gcc-mingw-w64-x86-64 \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: windows-gnu

      # Compiles the cfg(windows) code the Linux checks skip — the in-app
      # updater's installer path lives behind that cfg.
      - run: cargo check --workspace --target x86_64-pc-windows-gnu
        working-directory: src-tauri

  frontend:
    name: pnpm typecheck
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: bindings

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # src/types/ is generated by ts-rs during `cargo test`; a checkout has
      # the committed copies, and this regenerates them so a stale binding
      # fails the typecheck instead of passing on the committed one.
      - run: cargo test --workspace
        working-directory: src-tauri

      - run: pnpm typecheck

      - name: Check that the committed ts-rs bindings are up to date
        run: git diff --exit-code -- src/types
