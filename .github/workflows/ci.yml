name: CI

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: cargo check / test / clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Everything the Tauri crate links against. The daemon and the CLI need
      # none of it, but the workspace builds as a unit.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      # ts-rs writes the TypeScript bindings during `cargo test`, and the
      # frontend typecheck below reads them, so the Rust job runs first and
      # the frontend job re-runs the tests rather than sharing state.
      # --workspace is mandatory: src-tauri is both the workspace root and the
      # `nerevar` package, so a bare command skips nerevar-core and the two
      # headless crates entirely.
      - run: cargo check --workspace
        working-directory: src-tauri

      # Building and running the tests are separate steps so that a runner
      # lost mid-way (GitHub's "lost communication with the server", which
      # leaves no log for the step in flight) still says which phase died,
      # and the step between records what the build left for the tests.
      - name: Build the tests
        run: cargo test --workspace --no-run
        working-directory: src-tauri

      - name: Disk and memory after the build
        run: |
          df -h /
          du -sh src-tauri/target
          free -m

      - name: Run the tests
        run: cargo test --workspace
        working-directory: src-tauri

      - run: cargo clippy --workspace --all-targets
        working-directory: src-tauri

  windows-cross-check:
    name: cargo check (windows target)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies and mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            gcc-mingw-w64-x86-64 \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: windows-gnu

      # Compiles the cfg(windows) code the Linux checks skip — the in-app
      # updater's installer path lives behind that cfg.
      - run: cargo check --workspace --target x86_64-pc-windows-gnu
        working-directory: src-tauri

  frontend:
    name: pnpm typecheck
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          key: bindings

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # src/types/ is generated by ts-rs during `cargo test`; a checkout has
      # the committed copies, and this regenerates them so a stale binding
      # fails the typecheck instead of passing on the committed one.
      - run: cargo test --workspace
        working-directory: src-tauri

      - run: pnpm typecheck

      - name: Check that the committed ts-rs bindings are up to date
        run: git diff --exit-code -- src/types
